#   rtp-night-shift 0088cfc9-1310-4926-ab7e-1e3991028ed9
#   rtp-swarm-ci    ca591cef-4b09-4797-b80d-fbbb04098ce4
#   rtp-fee-crank   (new — fee withdrawal + redistribute cron)
#   rtp-promote-strategy (new — reads night results, promotes strategy on-chain)
#
# Dockerfile paths configured in Railway dashboard Settings tab:
#   rtp-dashboard   → dashboard/Dockerfile
#   rtp-devnet-loop → rtp/swarm/Dockerfile.daemon
#   rtp-night-shift → research/Dockerfile
#   rtp-swarm-ci    → rtp/Dockerfile.ci
#
# Cron schedules (set via GraphQL serviceInstanceUpdate mutation):
#   rtp-devnet-loop → 0 */6 * * * (every 6 hours)
#   rtp-night-shift → 0 14 * * * (daily at 14:00 UTC)
#   rtp-fee-crank   → 0 * * * * (every hour, with 0-30min jitter built into script)
#   rtp-promote-strategy → 30 14 * * * (30 min after night shift, reads results + promotes on-chain)
#   rtp-swarm-ci    → manual redeploy only
#   rtp-dashboard   → always-on (no cron)
#
# Build notes:
#   - Build context is always the repo root, even with Dockerfile Path set
#   - Devnet-loop Dockerfile COPY paths use rtp/swarm/ prefix
#   - Devnet-loop requires Rust 1.88+ (serde_with 3.18, icu_properties_data 2.2)
#   - Devnet-loop needs env vars: LLM_API_BASE_URL, LLM_API_KEY, LLM_MODEL
#   - Night-shift uses --skip-fetch (Binance geo-blocked on Railway)
#   - Dashboard uses output: "standalone" in next.config.ts (SSR mode)
#
# Fee crank (rtp-fee-crank):
#   - Dockerfile: scripts/Dockerfile.crank
#   - Runs every hour with 0-30min random jitter
#   - Calls withdrawAndRedistribute for the demo treasury
#   - Needs env vars: KEYPAIR_PATH (or default ~/.config/solana/id.json)
#   - Gas paid by fee-payer keypair (Driyi8S...EF6R)
#
# Strategy promotion (rtp-promote-strategy):
#   - Dockerfile: scripts/Dockerfile.promote
#   - Runs at 14:30 UTC (30 min after night shift completes)
#   - Reads data/night_results/<latest>/summary.json
#   - Promotion gate: Sharpe>=2.5, Consistency>=70%, Trades/fold>=15, Fragility<=0.40
#   - Calls register_strategy via SDK with fee-payer as authority
#   - Night results baked into Docker image at build time (COPY data/night_results/)
#
# API:
#   GraphQL endpoint: https://backboard.railway.com/graphql/v2
#   Cron mutation requires workspace-level API token (not project token)
#   Project tokens use "Project-Access-Token" header (not "Authorization: Bearer")
