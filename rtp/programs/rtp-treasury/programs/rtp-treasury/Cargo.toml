[package]
name = "rtp-treasury"
version = "0.1.0"
description = "Resilient Token Protocol — PDA-owned treasury with fee withdrawal, redistribution, swarm hydration, and phase evolution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rtp_treasury"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.0" }
anchor-spl = "1.0.0"
spl-token-2022-interface = "2.1.0"

[profile.release]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(anchor_debug, values("true", "false"))'] }
