[package]
name = "rtp-swarm"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Devnet-only stubs that simulate mainnet-only functionality (e.g. SOL→USDC
# conversion via Phantom perps bridge). These are never compiled for mainnet.
devnet = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
dashmap = "6"
aes-gcm = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery"] }
rmp-serde = "1"
rmp = "0.8"
solana-sdk = "2"
bincode = "1"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "rtp-demo"
path = "src/bin/rtp-demo.rs"

[[bin]]
name = "rtp-daemon"
path = "src/bin/rtp-daemon.rs"
