[package]
name = "rtp-swarm"
version = "0.1.0"
edition = "2024"
license = "BSL-1.1"

[features]
default = []
# Devnet-only stubs that simulate mainnet-only functionality (e.g. SOL→USDC
# conversion via Phantom perps bridge). These are never compiled for mainnet.
devnet = []
# Legacy Hyperliquid/Phantom MCP execution path. Archived — the Flash Trade
# CPI path (default) replaces this. Enable only for backward compatibility.
hyperliquid = []
# Test-only utilities (e.g. ChainConfig::test_default). Not compiled into release binaries.
test-utils = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
aes-gcm = "0.11"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery"] }
rmp = "0.8"
# Pinned to 2.1 to unify with gmsol-sdk's internal solana-sdk range
# (>=2.1,<2.2). The swarm only uses basic SDK APIs (signer, pubkey,
# system_program, transactions) which are identical across 2.x.
solana-sdk = "2.1"
bincode = "1"
base64 = "0.22"
# GMTrade execution venue (gmx-solana). Pinned at the commit validated by the
# keeper-fill probe (research/missions/gmtrade_probe/TRADE-PROBE-RESULTS.md).
gmsol-sdk = { git = "https://github.com/gmsol-labs/gmx-solana", rev = "3175cda304748ef24cbf96156021a320dbf1f061", default-features = false, features = ["client", "decode"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "rtp-demo"
path = "src/bin/rtp-demo.rs"

[[bin]]
name = "rtp-daemon"
path = "src/bin/rtp-daemon.rs"

[[bin]]
name = "rtp-trader"
path = "src/bin/rtp-trader.rs"
