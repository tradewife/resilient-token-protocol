name: Devnet Loop — Autonomous Cycle

on:
  # Paused — devnet loop moved to Railway
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rtp/swarm
      - name: Run devnet cycle
        env:
          LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        working-directory: rtp/swarm
        run: cargo run --release --bin rtp-daemon
      - name: Commit cycle output
        run: |
          git config user.name "RTP Devnet Loop"
          git config user.email "devnet-loop[bot]@users.noreply.github.com"
          git add data/devnet-cycles/
          git diff --cached --quiet || git commit -m "devnet cycle: $(date -u +%Y-%m-%dT%H) results"
          git push || echo "Push failed — cycle data preserved locally for next run"
