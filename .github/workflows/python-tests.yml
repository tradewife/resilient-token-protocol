name: Python Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Check OHLCV data
      run: |
        if ls data/ohlcv/*.parquet 1>/dev/null 2>&1; then
          echo "Found $(ls data/ohlcv/*.parquet | wc -l) parquet files"
        else
          echo "WARNING: No OHLCV parquet files — bridge-mode and night-shift tests will be limited"
        fi

    - name: Smoke test — module imports
      run: |
        python -c "
        import research.orchestration.night_shift
        import research.validation.validate_night_shift
        import research.optimization.evaluator_calibration
        import research.validation.discrepancy_detector
        import research.live.paper_trader
        import research.simulation.future_blind_simulator
        import research.simulation.run_backtest_r2
        import research.data.download_ohlcv
        import research.optimization.save_winning_config
        print('All research modules import OK')
        "

    - name: Smoke test — CLI help
      run: |
        python -m research.orchestration.night_shift --help
        python -m research.validation.validate_night_shift --help
        python -m research.optimization.evaluator_calibration --help

    - name: Smoke test — bridge-mode JSON schema
      run: |
        # Verify the Python bridge output matches what Rust BridgeResponse expects.
        # Uses --skip-fetch with a minimal JSON request via stdin.
        echo '{"symbol":"BTC/USDT","config":{"params":{}}}' | \
          python -m research.orchestration.night_shift --bridge-mode --skip-fetch 2>/dev/null | \
          python -c "
        import sys, json
        resp = json.load(sys.stdin)
        required = ['strategy','yield_estimate','confidence','params','folds_validated','consistency']
        missing = [k for k in required if k not in resp]
        if missing:
            print(f'MISSING FIELDS: {missing}')
            sys.exit(1)
        if 'error' in resp:
            print(f'Bridge error (expected if no data): {resp[\"error\"]}')
        else:
            print(f'Bridge response OK: strategy={resp[\"strategy\"]}, folds={resp[\"folds_validated\"]}')
        "