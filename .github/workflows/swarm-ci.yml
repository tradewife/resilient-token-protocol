name: Swarm CI — Build + Test + Coverage

on:
  push:
    branches: [main]
    paths:
      - "rtp/**"
      - "sdk/**"
      - ".github/workflows/swarm-ci.yml"
      - "AGENTS.md"
  pull_request:
    branches: [main]
    paths:
      - "rtp/**"
      - "sdk/**"
      - ".github/workflows/swarm-ci.yml"
      - "AGENTS.md"
  workflow_dispatch:

jobs:
  swarm-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Pinned to match the dev toolchain + Docker builders (1.94).
        # stable (1.97 at first enable) fired lints that never appear
        # locally — keep CI deterministic with the local environment.
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-nextest + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rtp/swarm/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('rtp/swarm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Cargo build
        working-directory: rtp/swarm
        run: cargo build --release

      - name: Cargo test + coverage (fail-under 70%)
        working-directory: rtp/swarm
        # nextest (profile ci → JUnit XML + slow-test timing) under llvm-cov.
        # 70% line threshold calibrated 2026-08-17 at 72.88% (gmtrade.rs is
        # 0% — mainnet integration, not unit-testable).
        run: |
          cargo llvm-cov nextest --lib --profile ci \
            --fail-under-lines 70 \
            --summary-only

      - name: Upload test report (JUnit + timing)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swarm-test-report
          path: rtp/swarm/target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Cargo clippy
        working-directory: rtp/swarm
        run: cargo clippy -- -D warnings

      - name: Cargo fmt check
        working-directory: rtp/swarm
        run: cargo fmt --check

  agents-md-validation:
    # Keeps AGENTS.md honest: the verification commands it documents must
    # actually run. If a documented command breaks, CI fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rtp/swarm/target
          key: ${{ runner.os }}-cargo-agentsmd-${{ hashFiles('rtp/swarm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-agentsmd-

      - name: Run AGENTS.md verification commands
        run: |
          set -e
          # Commands listed under "## Verification commands" in AGENTS.md:
          # full suite (lib + integration) — `--lib` alone hid a broken
          # integration target for a week (Aug 16-24).
          cd rtp/swarm && cargo test

  test-summary:
    needs: [swarm-build-and-test, agents-md-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Swarm CI: ${{ needs.swarm-build-and-test.result }}"
          echo "AGENTS.md validation: ${{ needs.agents-md-validation.result }}"
          if [[ "${{ needs.swarm-build-and-test.result }}" == "failure" ]] || \
             [[ "${{ needs.agents-md-validation.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
