# Dependency update automation — keeps npm, Cargo, and GitHub Actions
# deps current automatically (reduces the security-vulnerability window).
version: 2
updates:
  # --- npm ecosystems ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # NOTE: /cli deliberately absent — Flash Trade wound down Aug 2026 (execution
  # moved to GMTrade); cli/ is frozen legacy. No automated updates there.
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      next-js:
        patterns: ["next", "eslint-config-next"]
    ignore:
      # TS 7 is the native-compiler rewrite; revisit manually when the
      # ecosystem settles. @types/node majors track Node runtime upgrades
      # (currently Node 22) — bump deliberately, not automatically.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 10 crashes eslint-plugin-react (unported to the new API) —
      # revisit when eslint-config-next supports eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(dashboard)"

  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(sdk)"

  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(scripts)"

  # --- Rust ---
  - package-ecosystem: "cargo"
    directory: "/rtp/swarm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(swarm)"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
